Trait lines: Trickery gives boons and initiative, Deadly Arts damage, Acrobatics (Pumping Up, Swindler's Equilibrium, Upper Hand) better dodges and Critical Strikes (Twin Fangs, Practiced Tolerance, No Quarter - or Invigorating Precision for sustain) damage; choose two of the four next to Daredevil. Trickery and Deadly Arts are shown.

