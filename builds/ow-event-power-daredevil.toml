Utility alternatives: Assassin's Signet instead of Haste; Fist Flurry for melee or Impairing Daggers for ranged damage; Thieves Guild instead of Dagger Storm for more damage on a longer cooldown.

Sigils: Fire and Stamina on the Shortbow, Strength on the Staff; Sigil of Blood is also interesting for life steal.

Relic candidates: Thief, Zakiros.

Deadly Arts and Critical Strikes are the go-to damage lines. Trickery is an open-world option that gives you more initiative and boons for your allies.
