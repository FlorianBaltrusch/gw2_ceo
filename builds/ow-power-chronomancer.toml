notes = """
Utility alternatives: Well of Action or Well of Calamity instead of Well of Precognition; Blink instead of Phantasmal Defender.

Relic candidates: Pirate Queen, Midnight King, Claw.

Damage weapons: usually two of Dagger/Sword, Spear and Greatsword. Sword/Focus is good for pulling enemies and for reflects, but deals less damage.

Trait lines in general: Domination, Dueling and the elite specialization are the default damage lines. In open world, Illusions is a strong alternative because it provides boons you might not have; take it instead of Domination, but only without a greatsword - with a greatsword keep Domination for Bountiful Blades, and Dueling stays because of its many damage buffs. With a greatsword always choose Bountiful Blades over Empowered Illusions. For sustain, Inspiration (Sympathetic Visage, Ego Restoration, Restorative Illusions) replaces Dueling with a greatsword and Domination otherwise; Illusions plus Inspiration is possible but costs a lot of damage. Inspiration's adept slot is flexible: Medic's Feedback to revive allies, Restorative Mantras to heal allies with mantras, Sympathetic Visage so phantasms take conditions from you (the most solo-friendly option).
